services:
  quizyzuna-db:
    container_name: Database
    image: postgres:16.3
    restart: always
    environment:
      - POSTGRES_DB=quizyzuna-db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - ./.containers/database:/var/lib/postgressql/data
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  quizyzuna-api:
    container_name: API
    image: ${DOCKER_REGISTRY-}quizyzunaapi
    build:
      context: src/
    depends_on:
        quizyzuna-db:
          condition: service_healthy
    restart: on-failure
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Database=Host=Database;Username=postgres;Password=postgres;Database=quizyzuna-db;
    ports:
      - "5215:5215"

  quizyzuna-keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: Keycloak
    command: start-dev
    environment:
        - KC_HEALTH_ENABLED=true
        - KC_BOOTSTRAP_ADMIN_USERNAME=admin
        - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
        - KC_DB=postgres
        - KC_DB_URL=jdbc:postgresql://Database/quizyzuna-db 
        - KC_DB_USERNAME=postgres
        - KC_DB_PASSWORD=postgres
    volumes:
        - ./.containers/identity:/opt/keycloak/data
    ports:
        - 18080:8080    
    depends_on:
        quizyzuna-db:
          condition: service_healthy
    